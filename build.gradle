plugins {
    id 'java'
    id 'java-library'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

group 'com.chainedminds.g2g.api'
version = '1.0.4'

repositories {
    mavenCentral()
    maven {
        url 'https://jitpack.io'
    }
}


dependencies {
    implementation 'com.chainedminds:sharedfeatures:1.4.2'
}